name: Build and verify Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and package without physical disk writes
        shell: pwsh
        run: ./tools/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ninmagic-nx-windows-x64
          path: dist/ninmagic-nx-1.0.0-windows-x64.zip
